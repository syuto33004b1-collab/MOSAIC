version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Majors with no combination of packages that installs. Measured 2026-09-01
    # (#239); each entry says what has to change before it comes out. Only the
    # blocked major is named, so the next one is offered and judged on its own.
    ignore:
      # `npm ci` cannot resolve: typescript-eslint 8.69.0, the newest there is,
      # still peers `typescript >=4.8.4 <6.1.0`. Remove when it accepts 7.
      - dependency-name: typescript
        versions: ["7.x"]
      # eslint-plugin-jsx-a11y 6.10.2 and eslint-plugin-react 7.37.5, both the
      # newest there are, still cap at eslint 9. `@eslint/js` alone would leave
      # two copies in the lockfile and an unsatisfied peer. Remove when both
      # plugins accept eslint 10.
      - dependency-name: "@eslint/js"
        versions: ["10.x"]
      - dependency-name: eslint
        versions: ["10.x"]
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
