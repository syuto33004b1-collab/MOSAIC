name: Deploy MOSAIC to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_REQUIRE_SHARED_MODE: ${{ vars.VITE_REQUIRE_SHARED_MODE }}
      VITE_ENABLE_GOOGLE_AUTH: ${{ vars.VITE_ENABLE_GOOGLE_AUTH }}
      VITE_APP_ENV: production
      VITE_RELEASE: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate runtime configuration
        shell: bash
        run: |
          if [[ -n "$VITE_REQUIRE_SHARED_MODE" && "$VITE_REQUIRE_SHARED_MODE" != "true" && "$VITE_REQUIRE_SHARED_MODE" != "false" ]]; then
            echo "::error::VITE_REQUIRE_SHARED_MODE must be true or false."
            exit 1
          fi
          if [[ -n "$VITE_ENABLE_GOOGLE_AUTH" && "$VITE_ENABLE_GOOGLE_AUTH" != "true" && "$VITE_ENABLE_GOOGLE_AUTH" != "false" ]]; then
            echo "::error::VITE_ENABLE_GOOGLE_AUTH must be true or false."
            exit 1
          fi
          if [[ -z "$VITE_SUPABASE_URL" && -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            if [[ "$VITE_REQUIRE_SHARED_MODE" == "true" ]]; then
              echo "::error::Shared mode is required, but the Supabase runtime variables are missing."
              exit 1
            fi
            echo "Supabase is not configured; building the demo fallback."
            exit 0
          fi
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Set both VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY, or leave both empty."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_URL" != https://* ]]; then
            echo "::error::VITE_SUPABASE_URL must use HTTPS."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::Use a modern Supabase publishable key; secret and service-role keys are forbidden."
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Test and build
        run: npm test
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mosaic-dist
          path: dist
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    environment: cloudflare
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mosaic-dist
          path: dist
      - name: Require Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID on the cloudflare environment before merging."
            exit 1
          fi
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.2"
          command: deploy
      - name: Verify deployed entry point
        shell: bash
        run: >-
          curl --fail --silent --show-error --location
          --retry 5 --retry-delay 5 --retry-all-errors
          "${{ steps.deploy.outputs.deployment-url }}" --output /dev/null
