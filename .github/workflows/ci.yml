name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * 1"

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: true
      VITE_APP_ENV: test
      VITE_RELEASE: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  database:
    name: Database policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start isolated Postgres
        run: >-
          npm exec supabase -- start --yes --exclude
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Lint database functions
        run: npm exec supabase -- db lint --local --schema app,private,public --level warning --fail-on error
      - name: Test tenant and role policies
        run: npm exec supabase -- test db supabase/tests --local
      - name: Stop isolated Postgres
        if: always()
        run: npm exec supabase -- stop --no-backup

  evaluation-record:
    name: Evaluation record
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # For the bypass label, and nothing else. Fork pull requests get a
      # read-only token regardless, which the label step checks for (#74).
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Collect the commits and changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rev-list "$BASE_SHA".."$HEAD_SHA" > "$RUNNER_TEMP/commits.txt"
          git diff --name-only "$BASE_SHA".."$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          # How much the head adds on top of each commit, so the check can report
          # what went unevaluated in files and lines rather than in commits: one
          # commit can rewrite the whole diff (#74). One row per commit, and a
          # pull request has few of them.
          : > "$RUNNER_TEMP/growth.txt"
          while read -r sha; do
            [ -n "$sha" ] || continue
            # Parsed by its English words below, so the locale is pinned.
            stat=$(LC_ALL=C git diff --shortstat "$sha".."$HEAD_SHA")
            files=$(printf '%s' "$stat" | grep -oE '[0-9]+ file' | grep -oE '[0-9]+' || echo 0)
            plus=$(printf '%s' "$stat" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
            minus=$(printf '%s' "$stat" | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo 0)
            printf '%s %s %s %s\n' "$sha" "${files:-0}" "${plus:-0}" "${minus:-0}" >> "$RUNNER_TEMP/growth.txt"
          done < "$RUNNER_TEMP/commits.txt"
      - name: Check the pre-PR evaluation record
        id: record
        env:
          # The body is author-controlled. Pass it through the environment and
          # stdin only; never interpolate it into the shell.
          PR_BODY: ${{ github.event.pull_request.body }}
          # Who GitHub says opened it. A bot's dependency bump owes no evaluation
          # record because there was no pre-PR evaluation to record (#237).
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" | node scripts/check-evaluation-record.mjs \
            "$RUNNER_TEMP/commits.txt" "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/growth.txt"
      # The whole of what #74 decided to build: a bypassed pull request has to be
      # findable later without reading every body. `always()` because a bypass
      # whose reason was too short still fails the step above, and that one is the
      # most worth finding. Skipped for forks, where the token is read-only —
      # this job runs on `pull_request`, never on `pull_request_target`.
      - name: Label a pull request that skipped the evaluation
        if: >-
          always()
          && steps.record.outputs.bypass == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh label create 評価なし --color BFD4F2 --description "独立評価を通していない PR（#74）" 2>/dev/null || true
          gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels" -f "labels[]=評価なし"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
